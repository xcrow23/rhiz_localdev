[pytest]
# Pytest configuration for Rhiz project

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths =
    core/skills/tests
    core/memory/tests
    tools/rhiz-mcp/tests

# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    --color=yes
    -ra

# Markers for test categorization
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (require Qdrant running)
    slow: Slow tests (>1s execution time)
    accuracy: Golden test set for accuracy validation

# Minimum Python version
minversion = 3.9

# Ignore patterns
norecursedirs =
    .git
    __pycache__
    external
    Claude_Grooves
    docs
