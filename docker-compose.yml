# Rhiz Local Development Environment
# Docker Compose Orchestration for Human-AI Symbiotic Systems
# Version: 0.1.0
# Created: 2025-12-20

version: '3.8'

services:
  # ============================================================================
  # HUMMINGBOT - Trading Bot Infrastructure
  # ============================================================================
  hummingbot:
    image: hummingbot/hummingbot:latest
    container_name: rhiz_hummingbot
    stdin_open: true
    tty: true
    volumes:
      # Configuration persistence
      - ./domains/trading/hummingbot/conf:/conf
      - ./domains/trading/hummingbot/logs:/logs
      - ./domains/trading/hummingbot/data:/data
      # PMM scripts (if using advanced strategies)
      - ./domains/trading/strategies:/scripts
    environment:
      # Loaded from .env file
      - CONFIG_PASSWORD=${HUMMINGBOT_PASSWORD}
      - CONFIG_FILE_PATH=/conf
    networks:
      - rhiz_network
    restart: unless-stopped
    # Resource limits (leave headroom for OS + Claude Desktop)
    mem_limit: 2g
    cpus: 2
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================================
  # LOCALAI - Local Model Inference Server
  # ============================================================================
  localai:
    image: localai/localai:latest-aio-cpu
    container_name: rhiz_localai
    volumes:
      # Model storage
      - ./models/local:/models
      # Configuration
      - ./infrastructure/local/localai_config.yaml:/config.yaml
    environment:
      - THREADS=4
      - CONTEXT_SIZE=4096
      # Model preloading (optional, set in .env)
      - PRELOAD_MODELS=${LOCALAI_PRELOAD_MODELS:-}
    ports:
      # Bind to localhost only (security)
      - "127.0.0.1:8080:8080"
    networks:
      - rhiz_network
    restart: unless-stopped
    # Allocate most RAM for inference
    mem_limit: 8g
    cpus: 4
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/readyz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ============================================================================
  # REDIS - Session State & Job Queue (Future: n8n local instance)
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: rhiz_redis
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - rhiz_network
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # ============================================================================
  # QDRANT - Vector Database for Semantic Memory
  # ============================================================================
  qdrant:
    image: qdrant/qdrant:latest
    container_name: rhiz_qdrant
    volumes:
      # Vector storage persistence
      - qdrant_data:/qdrant/storage
    ports:
      # REST API (bind to localhost only)
      - "127.0.0.1:6333:6333"
      # gRPC API (optional, for high-performance clients)
      - "127.0.0.1:6334:6334"
    networks:
      - rhiz_network
    restart: unless-stopped
    # Lightweight allocation for vector storage
    mem_limit: 1g
    cpus: 1
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      # Qdrant minimal image doesn't have wget/curl - use /bin/sh TCP check
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/localhost/6333' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ============================================================================
  # WATCHTOWER - Automatic Container Updates (Optional, disabled by default)
  # ============================================================================
  # watchtower:
  #   image: containrrr/watchtower
  #   container_name: rhiz_watchtower
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock
  #   environment:
  #     - WATCHTOWER_CLEANUP=true
  #     - WATCHTOWER_SCHEDULE=0 0 3 * * *  # 3 AM daily
  #   restart: unless-stopped

# ==============================================================================
# NETWORKS
# ==============================================================================
networks:
  rhiz_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

# ==============================================================================
# VOLUMES
# ==============================================================================
volumes:
  redis_data:
    driver: local
  qdrant_data:
    driver: local

# ==============================================================================
# USAGE INSTRUCTIONS
# ==============================================================================
#
# First-time setup:
#   1. Copy .env.template to .env and fill in credentials
#   2. Run: docker-compose up -d
#   3. Attach to Hummingbot: docker attach rhiz_hummingbot
#   4. Detach without stopping: Ctrl+P, Ctrl+Q
#
# Common commands:
#   Start all services:     docker-compose up -d
#   Stop all services:      docker-compose down
#   View logs:              docker-compose logs -f [service_name]
#   Restart a service:      docker-compose restart [service_name]
#   Check status:           docker-compose ps
#
# Hummingbot interaction:
#   Attach:                 docker attach rhiz_hummingbot
#   Detach (keep running):  Ctrl+P, Ctrl+Q
#   Stop container:         docker-compose stop hummingbot
#
# LocalAI API endpoint:     http://localhost:8080
# Redis endpoint:           localhost:6379
#
# Resource monitoring:
#   docker stats rhiz_hummingbot rhiz_localai rhiz_redis
#
# ==============================================================================
