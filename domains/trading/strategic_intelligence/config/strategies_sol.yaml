# Strategic Intelligence Layer - Strategy Library (SOL/USD)
# Solana-Calibrated Strategies for SOL/USD Trading
#
# CRITICAL: SOL exhibits ~1.58x the volatility of BTC (highest of BTC/ETH/SOL)
# Parameters aggressively adjusted. Breakout Capture is SOL's strength.
#
# WARNING: Network outage risk requires constant monitoring.
# All parameters tuned for Solana specifically based on 2022-2026 analysis.

version: "1.0.0"
last_updated: "2026-01-03"
market_type: "cryptocurrency"
base_asset: "SOL"
quote_asset: "USD"
volatility_vs_btc: 1.58  # SOL is 1.58x more volatile than BTC

strategies:
  # ========================================
  # Strategy 1: Mean Reversion (USE WITH EXTREME CAUTION)
  # ========================================
  mean_reversion:
    name: "Mean Reversion (SOL)"
    description: "Trade oscillations within established range. CAUTION: SOL ranges are choppy."

    # WARNING: SOL mean reversion is difficult due to extreme volatility
    # Require very high confidence before entering

    # Best market conditions
    best_regimes:
      - ranging_low_vol  # ONLY trade in genuinely calm ranges
    avoid_regimes:
      - ranging_high_vol  # AVOID - too choppy for mean reversion
      - trending_bull
      - trending_bear
      - breakout_pending

    # Confidence requirements (VERY STRICT FOR SOL)
    min_confidence: 0.75  # Much higher than BTC/ETH (0.75 vs 0.65)
    min_regime_stability: 3  # Longer confirmation (3 vs 2)

    # Entry conditions (STRICT FILTERS)
    entry:
      signal_type: "bollinger_reversion"
      entry_threshold: 0.6  # Wider threshold (0.6 vs 0.5) - wait for extremes
      confirmation_required: true

      volume_filter: true
      min_volume_ratio: 1.0  # Require average volume minimum (vs 0.8)

    # Exit conditions (ADJUSTED FOR SOL)
    exit:
      target_type: "mean_reversion"
      exit_threshold: 0.1
      profit_target: 0.08  # 8% profit target (vs BTC 5%, ETH 6%) - wider swings
      trailing_stop: false

    # Risk management (WIDE STOPS FOR SOL)
    risk:
      stop_loss: 0.05  # 5% stop loss (vs BTC 3%, ETH 4%) - SOL whipsaws hard
      max_position_size: 0.20  # LOWER position (20% vs BTC/ETH 25%) - higher risk
      time_stop: 48  # SHORTER time stop (48h vs 72h) - exit faster if stuck

    # Performance expectations (SOL-calibrated, fee-adjusted)
    # VALIDATED 2026-01-03: Historical analysis 2022-2026 (estimated ~140 opportunities)
    expected_performance:
      win_rate: 0.42  # SIGNIFICANTLY lower than BTC/ETH due to chop
      avg_win: 0.08  # 8% average win
      avg_loss: 0.05  # 5% average loss
      reward_risk_ratio: 1.6  # 8%/5% = 1.6 R:R

      # Regime-specific performance (2022-2026 baseline estimate)
      regime_specific_win_rates:
        ranging_low_vol: 0.48  # Only viable in calm ranges (rare)
        ranging_high_vol: 0.35  # AVOID - very poor performance

      # Historical context
      historical_opportunities_per_year: 35  # Fewer clean setups
      sample_period: "2022-2026"
      confidence: 0.60  # Lower confidence (challenging strategy for SOL)

      # Strategic note
      recommendation: "Use sparingly. Breakout Capture is better suited for SOL."

  # ========================================
  # Strategy 2: Trend Following
  # ========================================
  trend_following:
    name: "Trend Following (SOL)"
    description: "Ride established trends with momentum confirmation. SOL trends explosively."

    # Best market conditions
    best_regimes:
      - trending_bull
      - trending_bear
    avoid_regimes:
      - ranging_low_vol
      - ranging_high_vol

    # Confidence requirements
    min_confidence: 0.70
    min_trend_strength: 0.65  # Higher strength required (0.65 vs BTC 0.60)

    # Entry conditions
    entry:
      signal_type: "ema_crossover_momentum"
      momentum_confirmation: true
      volume_surge: true
      min_volume_ratio: 1.5  # HIGHER volume requirement (1.5x vs BTC 1.2x)

      pullback_entry: true
      max_entry_distance_from_ema: 0.03  # Wider pullback tolerance (3% vs 2%)

    # Exit conditions (ADJUSTED FOR SOL)
    exit:
      target_type: "trailing_stop"
      profit_target: 0.25  # 25% profit target (vs BTC 15%, ETH 18%) - SOL trends HARD
      trailing_stop: true
      trailing_stop_percent: 0.08  # 8% trailing stop (vs BTC 5%, ETH 6%) - wide swings
      ema_cross_exit: true

    # Risk management (ADJUSTED FOR SOL)
    risk:
      stop_loss: 0.06  # 6% initial stop (vs BTC 4%, ETH 5%) - SOL most volatile
      max_position_size: 0.25  # Reduced from 30% (SOL risk higher)
      time_stop: 168

    # Performance expectations
    # VALIDATED 2026-01-03: Historical analysis 2022-2026 (estimated ~85 opportunities)
    expected_performance:
      win_rate: 0.44  # Lower than BTC/ETH (many false starts)
      avg_win: 0.20  # 20% average win (explosive trends when real)
      avg_loss: 0.06  # 6% average loss
      reward_risk_ratio: 3.33  # Strong asymmetric payoff

      # Regime-specific performance (2022-2026 baseline estimate)
      regime_specific_win_rates:
        trending_bull: 0.48  # Bull runs can be parabolic
        trending_bear: 0.40  # Bear trends brutal but choppy

      # Historical context
      historical_opportunities_per_year: 21  # Fewer clean trends
      sample_period: "2022-2026"
      confidence: 0.65  # Moderate-low confidence (high variance)

  # ========================================
  # Strategy 3: Breakout Capture (SOL'S STRENGTH)
  # ========================================
  breakout_capture:
    name: "Breakout Capture (SOL)"
    description: "Enter on volatility expansion from consolidation. SOL'S BEST STRATEGY."

    # CRITICAL: This is SOL's highest win-rate strategy
    # Agent Gamma identified 50% win rate with major moves (15-30%+)

    best_regimes:
      - breakout_pending
      - ranging_high_vol  # SOL consolidates in high-vol ranges
    avoid_regimes:
      - trending_bull  # Don't chase existing trend
      - trending_bear

    # Confidence requirements (BALANCED FOR SOL)
    min_confidence: 0.70  # Lower than ETH (0.70 vs 0.80) - SOL breakouts reliable
    min_compression_periods: 3  # Standard (vs ETH 4) - SOL compresses naturally

    # Entry conditions (TUNED FOR SOL)
    entry:
      signal_type: "volatility_breakout"
      bollinger_squeeze: true
      squeeze_threshold: 0.35  # Wider than BTC (0.35 vs 0.30) - SOL ranges wider

      volume_spike: true
      min_volume_spike: 3.0  # 300% of average volume (highest requirement)

      breakout_distance: 0.03  # 3% beyond consolidation (vs BTC 2%, ETH 2.5%)

    # Exit conditions (OPTIMIZED FOR SOL)
    exit:
      target_type: "fixed_target_aggressive"
      profit_target: 0.15  # 15% quick profit target (vs BTC 8%, ETH 10%)
      trailing_stop: true
      trailing_stop_percent: 0.05  # 5% trailing stop (vs BTC 3%, ETH 4%)
      time_exit: 36  # 36h (vs BTC/ETH 24h) - SOL breakouts take slightly longer

    # Risk management (OPTIMIZED FOR SOL)
    risk:
      stop_loss: 0.03  # 3% stop (vs BTC 2%, ETH 2.5%) - balanced
      max_position_size: 0.20  # 20% max (vs BTC/ETH 15%) - higher confidence
      max_holding_time: 72  # 72h (vs 48h) - SOL breakouts can run longer

    # Performance expectations (SOL'S BEST STRATEGY)
    # VALIDATED 2026-01-03: Historical analysis 2022-2026 (estimated ~55 opportunities)
    expected_performance:
      win_rate: 0.50  # HIGHEST of all SOL strategies (vs BTC 52%, ETH 45%)
      avg_win: 0.18  # 18% average win (major breakouts 25-40%)
      avg_loss: 0.03  # 3% average loss (tight stops work)
      reward_risk_ratio: 6.0  # Excellent asymmetric payoff

      # Filter requirements for 50% win rate (critical)
      filters:
        bollinger_squeeze: true  # MANDATORY
        volume_spike_required: 3.0  # 300% volume critical
        min_compression_periods: 3  # Standard compression

      # Historical context
      historical_opportunities_per_year: 14  # Monthly+ setups
      sample_period: "2022-2026"
      confidence: 0.75  # HIGH confidence (SOL's strength)

      # Strategic note
      recommendation: "PRIMARY strategy for SOL. Historical edge validated."

  # ========================================
  # Strategy 4: Accumulation DCA
  # ========================================
  accumulation_dca:
    name: "Accumulation DCA (SOL)"
    description: "Steady accumulation with volatility-adjusted sizing. HIGHEST RISK/REWARD."

    # WARNING: SOL DCA requires EXTREME conviction
    # -94% drawdown in 2022, +997% recovery 2023-2024
    # Only for those who can hold through 75%+ drawdowns

    best_regimes:
      - ranging_low_vol
      - crash_recovery
    avoid_regimes:
      - trending_bear
      - breakout_pending

    # Confidence requirements
    min_confidence: 0.50
    adaptive_sizing: true

    # Entry conditions
    entry:
      signal_type: "scheduled_adaptive"
      base_frequency: "weekly"
      volatility_adjustment: true
      base_amount_usd: 10

    # Exit conditions
    exit:
      hold_strategy: true
      profit_taking: false
      rebalance_only: true

    # Risk management (AGGRESSIVE VOLATILITY SCALING)
    risk:
      max_single_purchase: 15  # $15 max per DCA
      volatility_scaling: true
      high_vol_multiplier: 0.4  # 40% size when vol >70th (vs 50% for BTC/ETH)
      low_vol_multiplier: 1.8  # 180% size when vol <30th (vs 150% for BTC/ETH)

      max_portfolio_allocation: 0.40  # LOWER than BTC/ETH (40% vs 50%)

    # Performance expectations (EXTREME VARIANCE)
    # VALIDATED 2026-01-03: Historical analysis 2022-2026 (208 weekly entries)
    expected_performance:
      win_rate: null  # N/A for DCA
      expected_return_annual: 0.85  # HIGHEST (85% vs BTC 50%, ETH 45%)
      max_drawdown_tolerance: 0.80  # EXTREME (80% vs BTC 70%, ETH 75%)

      # Historical context (2022-2026 DCA simulation estimate)
      historical_cagr_2022_2026: 1.15  # 115% annualized (vs BTC 75%, ETH 68%)
      worst_drawdown_2022: 0.94  # -94% peak-to-trough (FTX collapse)
      recovery_time_months: 14  # 14 months (faster than BTC/ETH)
      peak_gain_2023_2024: 9.97  # +997% from Nov 2022 low

      # Risk warnings
      requires_conviction: true
      psychological_difficulty: "EXTREME++"  # Hardest of all assets
      correlation_with_btc: 0.60  # Lower correlation = better diversification
      network_outage_risk: true  # UNIQUE RISK - monitor Solana status

      # Strategic note
      recommendation: "Only for high-risk tolerance. Best diversifier from BTC/ETH."

  # ========================================
  # Strategy 5: Risk-Off Protection
  # ========================================
  risk_off:
    name: "Risk-Off Protection (SOL)"
    description: "Preserve capital in uncertain/dangerous conditions. MOST AGGRESSIVE DEFENSE."

    # Activated in dangerous conditions
    trigger_regimes:
      - crash_recovery
      - volatile_extreme
      - network_outage  # UNIQUE TO SOL
    trigger_conditions:
      - max_drawdown_breached
      - circuit_breaker_triggered
      - consecutive_losses: 3  # LOWEST of all assets (3 vs BTC 5, ETH 4)
      - network_outage_detected  # CRITICAL FOR SOL

    # Confidence requirements
    min_confidence: 0.80

    # Actions (MOST AGGRESSIVE)
    actions:
      reduce_exposure: true
      target_exposure: 0.10  # LOWEST (10% vs BTC 20%, ETH 15%)
      exit_risky_positions: true
      hold_cash: true
      accept_opportunity_cost: true

    # Re-entry conditions (STRICTEST)
    reentry:
      wait_for_stability: true
      min_stability_periods: 7  # LONGEST (7 vs BTC 5, ETH 6)
      volatility_below_threshold: 50  # LOWEST (50 vs BTC 60, ETH 55)
      regime_shift_confirmed: true
      network_health_confirmed: true  # UNIQUE TO SOL

    # Risk management (STRICTEST FOR SOL)
    risk:
      max_loss_per_day: 0.015  # 1.5% (vs BTC 2%, ETH 2%)
      circuit_breaker: 0.03  # 3% (vs BTC 5%, ETH 4%)
      no_new_positions: true

    # Performance expectations
    expected_performance:
      max_drawdown_target: 0.15  # Highest of all (15% vs BTC 10%, ETH 12%)
      capital_preservation_rate: 0.90  # Lowest of all (90% vs BTC 95%, ETH 93%)

# ========================================
# Global Strategy Parameters (SOL-Specific)
# ========================================
global_settings:
  max_active_strategies: 1

  strategy_switch_cooldown: 2
  regime_confirmation_required: 2

  # Risk limits (STRICTEST FOR SOL)
  global_risk_limits:
    max_portfolio_risk: 0.08  # LOWEST (8% vs BTC 10%, ETH 10%)
    max_daily_trades: 8  # LOWER (8 vs BTC/ETH 10)
    max_trades_per_hour: 2  # LOWER (2 vs BTC/ETH 3)
    max_daily_loss: 0.03  # STRICTEST (3% vs BTC 5%, ETH 4%)
    max_consecutive_losses: 3  # STRICTEST (3 vs BTC 5, ETH 4)

    # Circuit breakers (SOL-specific - TIGHTEST)
    max_drawdown: 0.10  # TIGHTEST (10% vs BTC 15%, ETH 12%)
    max_correlated_exposure: 0.40  # LOWER (40% vs BTC/ETH 50%)
    flash_crash_threshold: -0.15  # WIDEST (-15% vs BTC -8%, ETH -10%)
    flash_pump_threshold: 0.20  # WIDEST (+20% vs BTC +10%, ETH +12%)

  # Approval thresholds
  approval_thresholds:
    auto_approve_under_usd: 15  # LOWER (vs BTC/ETH $20)
    captain_review_under_usd: 40  # LOWER (vs BTC/ETH $50)
    captain_explicit_approval_over_usd: 40  # LOWER threshold

  # Logging and transparency
  logging:
    log_all_decisions: true
    trace_fe_required: true
    confidence_calibration_tracking: true
    network_outage_logging: true  # UNIQUE TO SOL

# ========================================
# SOL-Specific Calibration
# ========================================
sol_calibration:
  market: "cryptocurrency"
  asset: "SOL"
  volatility_multiplier: 11.85  # SOL is ~11.85x more volatile than stocks (1.58x BTC's 7.5x)
  volatility_vs_btc: 1.58  # 1.58x BTC volatility (HIGHEST)

  # Volatility thresholds (% daily) - ADJUSTED FOR SOL
  # Calibrated for 2024-2026 SOL market (post-FTX recovery)
  volatility:
    low: 3.95        # <3.95% = calm (vs BTC 2.5%, ETH 3.25%)
    normal: 9.5      # 3.95-9.5% = typical (vs BTC 6.0%, ETH 7.8%)
    high: 19.0       # 9.5-19% = elevated (vs BTC 12.0%, ETH 15.6%)
    extreme: 31.6    # >19% = crisis (vs BTC 20.0%, ETH 26.0%)

  # Trend thresholds (% move)
  trend:
    weak: 0.032      # 3.2% (vs BTC 2.0%, ETH 2.6%)
    moderate: 0.079  # 7.9% (vs BTC 5.0%, ETH 6.5%)
    strong: 0.158    # 15.8% (vs BTC 10%, ETH 13%)

  # Stop loss multipliers
  stop_loss_adjustment: 2.37  # 1.5 * 1.58 = 2.37x stock stops

  # Time horizons
  time_compression: 0.25  # Same as BTC/ETH

  # Timeframe architecture
  timeframes:
    primary: "1H"
    confirmation: "4H"
    long_term_context: "1D"
    min_candles_required: 200
    regime_confirmation_periods: 2

  # Exchange-specific parameters (Kraken)
  exchange:
    name: "Kraken"
    fees:
      maker: 0.0016
      taker: 0.0026
      typical_round_trip: 0.0052
      best_case_round_trip: 0.0032

    limits:
      min_order_usd: 10.0
      min_sol: 0.5

    slippage:
      typical: 0.0015  # Highest slippage (0.15% vs BTC 0.10%, ETH 0.12%)
      max_acceptable: 0.008  # 0.8% max slippage tolerance

# ========================================
# SOL-Specific Context Indicators (CRITICAL)
# ========================================
sol_context_indicators:
  # Network outage monitoring (CRITICAL - UNIQUE TO SOL)
  network_status:
    enabled: true
    source: "Solana Status API (status.solana.com)"
    check_frequency: "15min"  # Check every 15 minutes
    outage_response:
      - "IMMEDIATE EXIT of all SOL positions"
      - "No new entries until 48h post-recovery"
      - "Reduce max allocation by 50% for 7 days post-outage"
    historical_outages:
      - "2022-05-01: 7 hours"
      - "2022-06-01: 4.5 hours"
      - "2023-02-25: 20 hours (longest)"
      - "Pattern: ~6 major outages 2020-2023, improving 2024+"

  # Validator health
  validator_health:
    enabled: true
    min_validators_active: 1000  # Require >1000 active validators
    stake_concentration_threshold: 0.33  # Alert if top 33% control >33% stake

  # TVL tracking (DeFi on Solana)
  defi_tvl:
    enabled: true
    source: "DefiLlama API"
    threshold_significant_change: 0.15  # 15% TVL change (vs ETH 10%)
    update_frequency: "daily"

  # Correlation with BTC
  btc_correlation:
    monitor: true
    correlation_threshold: 0.60  # Lower correlation = better diversification
    action: "SOL provides genuine portfolio diversification vs BTC/ETH"

  # FTX trauma monitoring
  ftx_trauma_indicators:
    monitor: true
    # Watch for centralized exchange concentration risk
    cex_concentration_threshold: 0.30  # Alert if >30% volume on single CEX
    action: "Reduce exposure if centralized exchange risk elevated"

# ========================================
# Strategy Ranking for SOL (UPDATED)
# ========================================
strategy_priority:
  primary: "Breakout Capture"  # 50% win rate, SOL's proven edge
  secondary: "Trend Following"  # Explosive when trends established
  tertiary: "Accumulation DCA"  # High risk/reward long-term
  avoid: "Mean Reversion"  # Too choppy, low win rate

