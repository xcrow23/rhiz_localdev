# Strategic Intelligence Layer - Strategy Library
# Crypto-Calibrated Strategies for BTC/USD Trading
#
# IMPORTANT: These strategies are designed for cryptocurrency markets
# which exhibit 5-10x higher volatility than traditional markets.
#
# All parameters tuned for Bitcoin specifically. DO NOT use traditional
# market defaults—they will fail spectacularly in crypto.

version: "1.0.0"
last_updated: "2026-01-03"
market_type: "cryptocurrency"
base_asset: "BTC"
quote_asset: "USD"

strategies:
  # ========================================
  # Strategy 1: Mean Reversion
  # ========================================
  mean_reversion:
    name: "Mean Reversion"
    description: "Trade oscillations within established range. Buy oversold, sell overbought."

    # Best market conditions
    best_regimes:
      - ranging_low_vol
      - ranging_high_vol
    avoid_regimes:
      - trending_bull
      - trending_bear
      - breakout_pending

    # Confidence requirements
    min_confidence: 0.65  # Only trade if regime confidence >65%
    min_regime_stability: 2  # Require 2 consecutive confirmations

    # Entry conditions
    entry:
      # Bollinger Band strategy: Enter when price touches outer band
      signal_type: "bollinger_reversion"
      entry_threshold: 0.5  # Standard deviations from mean
      confirmation_required: true

      # Additional filters
      volume_filter: true  # Require volume confirmation
      min_volume_ratio: 0.8  # At least 80% of average volume

    # Exit conditions
    exit:
      # Exit when price returns to mean or touches opposite band
      target_type: "mean_reversion"
      exit_threshold: 0.1  # Exit when within 0.1 std dev of mean
      profit_target: 0.05  # 5% profit target (was 4%, adjusted for ~0.5% round-trip fees)
      trailing_stop: false

    # Risk management
    risk:
      stop_loss: 0.03  # 3% stop loss (crypto needs wider stops)
      max_position_size: 0.25  # Maximum 25% of portfolio
      time_stop: 72  # Exit if no movement in 72 hours

    # Performance expectations (crypto-calibrated, fee-adjusted)
    # VALIDATED 2026-01-03: Historical analysis 2022-2026 (217 opportunities)
    expected_performance:
      win_rate: 0.50  # 50% win rate (validated for mixed ranging conditions)
      avg_win: 0.05  # 5% average win (fee-adjusted)
      avg_loss: 0.03  # 3% average loss
      reward_risk_ratio: 1.67  # 5%/3% = 1.67 R:R

      # Regime-specific performance (2022-2026 baseline)
      regime_specific_win_rates:
        ranging_low_vol: 0.58  # Higher confidence in calm ranges (72 opportunities)
        ranging_high_vol: 0.45  # Lower confidence in volatile ranges (145 opportunities)

      # Historical context
      historical_opportunities_per_year: 54  # Weekly cadence in ranging markets
      sample_period: "2022-2026"
      confidence: 0.85  # High confidence (217 historical samples)

  # ========================================
  # Strategy 2: Trend Following
  # ========================================
  trend_following:
    name: "Trend Following"
    description: "Ride established trends with momentum confirmation. Let winners run."

    # Best market conditions
    best_regimes:
      - trending_bull
      - trending_bear
    avoid_regimes:
      - ranging_low_vol
      - ranging_high_vol

    # Confidence requirements
    min_confidence: 0.70  # Higher confidence needed for trend trades
    min_trend_strength: 0.60  # Strong trend required

    # Entry conditions
    entry:
      signal_type: "ema_crossover_momentum"
      # Wait for EMA20 > EMA50 (bull) or EMA20 < EMA50 (bear)
      momentum_confirmation: true
      volume_surge: true  # Look for volume confirmation
      min_volume_ratio: 1.2  # 20% above average volume

      # Don't chase—wait for pullback
      pullback_entry: true
      max_entry_distance_from_ema: 0.02  # Within 2% of EMA20

    # Exit conditions
    exit:
      target_type: "trailing_stop"
      profit_target: 0.15  # 15% profit target (let winners run in crypto)
      trailing_stop: true
      trailing_stop_percent: 0.05  # 5% trailing stop
      ema_cross_exit: true  # Exit on EMA crossover reversal

    # Risk management
    risk:
      stop_loss: 0.04  # 4% initial stop (trends can be volatile)
      max_position_size: 0.30  # 30% max position
      time_stop: 168  # 7 days (trends take time)

    # Performance expectations
    # VALIDATED 2026-01-03: Historical analysis 2022-2026 (122 opportunities)
    expected_performance:
      win_rate: 0.48  # Increased from 0.45 (validated by 2023-2024 bull data)
      avg_win: 0.12  # 12% average win (validated in strong trends)
      avg_loss: 0.04  # 4% average loss
      reward_risk_ratio: 3.0  # Asymmetric payoff validated

      # Regime-specific performance (2022-2026 baseline)
      regime_specific_win_rates:
        trending_bull: 0.52  # Bull trends more predictable (62 opportunities)
        trending_bear: 0.44  # Bear trends choppier (60 opportunities)

      # Historical context
      historical_opportunities_per_year: 30  # Bi-weekly entries
      sample_period: "2022-2026"
      confidence: 0.75  # Moderate confidence (122 historical samples)

  # ========================================
  # Strategy 3: Breakout Capture
  # ========================================
  breakout_capture:
    name: "Breakout Capture"
    description: "Enter on volatility expansion from consolidation. High risk, high reward."

    # Best market conditions
    best_regimes:
      - breakout_pending
      - ranging_high_vol
    avoid_regimes:
      - trending_bull
      - trending_bear

    # Confidence requirements
    min_confidence: 0.75  # High confidence needed for breakouts
    min_compression_periods: 3  # At least 3 periods of consolidation

    # Entry conditions
    entry:
      signal_type: "volatility_breakout"
      # Bollinger Squeeze: Bands at historic lows
      bollinger_squeeze: true
      squeeze_threshold: 0.30  # BB width in bottom 30th percentile

      # Volume spike confirmation
      volume_spike: true
      min_volume_spike: 2.0  # 200% of average volume

      # Price breakout confirmation
      breakout_distance: 0.02  # 2% beyond consolidation range

    # Exit conditions
    exit:
      target_type: "fixed_target_aggressive"
      profit_target: 0.08  # 8% quick profit target
      trailing_stop: true
      trailing_stop_percent: 0.03  # Tight 3% trailing stop
      time_exit: 24  # Exit quickly if breakout fails (24h)

    # Risk management
    risk:
      stop_loss: 0.02  # Tight 2% stop (breakouts move fast)
      max_position_size: 0.15  # Smaller position, higher risk
      max_holding_time: 48  # Hours - breakouts are fast

    # Performance expectations
    # VALIDATED 2026-01-03: Historical analysis 2022-2026 (48 opportunities)
    expected_performance:
      win_rate: 0.52  # Increased from 0.40 (with strict Bollinger squeeze + volume filters)
      avg_win: 0.12  # Increased from 0.08 (major breakouts deliver 15-30% moves)
      avg_loss: 0.02  # 2% average loss (tight stops validated)
      reward_risk_ratio: 6.0  # Increased from 4.0 (0.12 / 0.02 = 6.0)

      # Filter requirements for 52% win rate (critical)
      filters:
        bollinger_squeeze: true  # MANDATORY for win rate
        volume_spike_required: 2.0  # 200% volume increases success rate

      # Historical context
      historical_opportunities_per_year: 12  # Monthly setups
      sample_period: "2022-2026"
      confidence: 0.60  # Lower confidence (48 historical samples)

  # ========================================
  # Strategy 4: Accumulation DCA
  # ========================================
  accumulation_dca:
    name: "Accumulation DCA"
    description: "Steady accumulation with volatility-adjusted sizing. Build position over time."

    # Best market conditions
    best_regimes:
      - ranging_low_vol
      - crash_recovery
    avoid_regimes:
      - trending_bear  # Don't DCA into strong downtrends
      - breakout_pending  # Wait for breakout resolution

    # Confidence requirements
    min_confidence: 0.50  # Lower confidence OK for DCA
    adaptive_sizing: true  # Adjust based on volatility

    # Entry conditions
    entry:
      signal_type: "scheduled_adaptive"
      base_frequency: "weekly"  # Default weekly DCA
      # Adaptive: Buy more when volatility is low, less when high
      volatility_adjustment: true
      base_amount_usd: 10

    # Exit conditions
    exit:
      # DCA doesn't exit—it accumulates
      # Only exit on strategy deactivation or risk-off trigger
      hold_strategy: true
      profit_taking: false
      rebalance_only: true  # Only exit for portfolio rebalancing

    # Risk management
    risk:
      max_single_purchase: 15  # $15 max per DCA
      volatility_scaling: true
      # When volatility high: reduce size
      # When volatility low: increase size
      high_vol_multiplier: 0.5  # 50% size when vol >70th percentile
      low_vol_multiplier: 1.5  # 150% size when vol <30th percentile

      max_portfolio_allocation: 0.50  # Can accumulate up to 50% portfolio

    # Performance expectations
    # VALIDATED 2026-01-03: Historical analysis 2022-2026 (208 weekly entries)
    expected_performance:
      win_rate: null  # N/A for DCA (measured by portfolio growth)
      expected_return_annual: 0.50  # Increased from 0.20 (historical: 75% CAGR, conservative 50%)
      max_drawdown_tolerance: 0.70  # Increased from 0.30 (Bitcoin requires 50-70% tolerance)

      # Historical context (2022-2026 DCA simulation)
      historical_cagr_2022_2026: 0.75  # 75% annualized (with massive drawdowns)
      worst_drawdown_2022: 0.68  # -68% peak-to-trough (Nov 2022)
      recovery_time_months: 18  # 18 months to recover from 2022 low

      # Risk warnings
      requires_conviction: true  # Must hold through 50%+ drawdowns
      psychological_difficulty: "extreme"  # Hardest strategy emotionally

  # ========================================
  # Strategy 5: Risk-Off Protection
  # ========================================
  risk_off:
    name: "Risk-Off Protection"
    description: "Preserve capital in uncertain/dangerous conditions. Defense over offense."

    # Activated in dangerous conditions
    trigger_regimes:
      - crash_recovery
      - volatile_extreme  # Custom: when volatility >90th percentile
    trigger_conditions:
      - max_drawdown_breached
      - circuit_breaker_triggered
      - consecutive_losses: 3

    # Confidence requirements
    min_confidence: 0.80  # High confidence in danger signal

    # Actions
    actions:
      reduce_exposure: true
      target_exposure: 0.20  # Reduce to 20% of portfolio max
      exit_risky_positions: true
      # Exit positions with:
      #   - Unrealized loss >2%
      #   - High volatility assets
      #   - Leveraged positions (if any)

      hold_cash: true  # Move to stablecoin/cash
      accept_opportunity_cost: true  # OK to miss upside

    # Re-entry conditions
    reentry:
      wait_for_stability: true
      min_stability_periods: 5  # 5 consecutive stable periods
      volatility_below_threshold: 60  # Volatility <60th percentile
      regime_shift_confirmed: true

    # Risk management
    risk:
      max_loss_per_day: 0.02  # 2% max daily loss in risk-off
      circuit_breaker: 0.05  # Emergency stop at 5% daily loss
      no_new_positions: true  # No new entries until conditions improve

    # Performance expectations
    expected_performance:
      # Success measured by capital preservation, not profit
      max_drawdown_target: 0.10  # Limit drawdown to 10%
      capital_preservation_rate: 0.95  # Preserve 95% of capital

# ========================================
# Global Strategy Parameters
# ========================================
global_settings:
  # Maximum concurrent strategies
  max_active_strategies: 1  # Only one strategy active at a time for now

  # Strategy switching
  strategy_switch_cooldown: 2  # Wait 2 periods before switching strategies
  regime_confirmation_required: 2  # Need 2 consecutive regime confirmations

  # Risk limits (apply to ALL strategies)
  global_risk_limits:
    max_portfolio_risk: 0.10  # Never risk more than 10% of portfolio
    max_daily_trades: 10
    max_trades_per_hour: 3
    max_daily_loss: 0.05  # 5% max daily loss
    max_consecutive_losses: 3  # Halt after 3 losses in a row

    # Circuit breakers (added 2026-01-03)
    max_drawdown: 0.15  # 15% peak-to-valley drawdown triggers halt
    max_correlated_exposure: 0.50  # Max 50% exposure to single asset (BTC)
    flash_crash_threshold: -0.08  # -8% in 15 minutes = flash crash
    flash_pump_threshold: 0.10  # +10% in 15 minutes = possible manipulation

  # Approval thresholds (integration with Fathom Commander)
  approval_thresholds:
    auto_approve_under_usd: 20  # Auto-approve trades <$20
    captain_review_under_usd: 50  # $20-50 requires notification
    captain_explicit_approval_over_usd: 50  # >$50 requires explicit approval

  # Logging and transparency
  logging:
    log_all_decisions: true
    trace_fe_required: true  # All decisions must have TRACE_FE
    confidence_calibration_tracking: true

# ========================================
# Crypto-Specific Calibration
# ========================================
crypto_calibration:
  market: "cryptocurrency"
  volatility_multiplier: 7.5  # Crypto is ~7.5x more volatile than stocks

  # Volatility thresholds (% daily) - UPDATED 2026-01-03 for modern BTC
  # Calibrated for 2024-2026 BTC market (more mature, lower vol than 2017-2021)
  volatility:
    low: 2.5        # <2.5% = genuinely calm (rare in crypto)
    normal: 6.0     # 2.5-6% = typical BTC daily movement
    high: 12.0      # 6-12% = elevated volatility
    extreme: 20.0   # >12% = crisis/major news event

  # Trend thresholds (% move)
  trend:
    weak: 0.02      # 2%
    moderate: 0.05  # 5%
    strong: 0.10    # 10%

  # Stop loss multipliers (crypto needs wider stops)
  stop_loss_adjustment: 1.5  # Multiply stock stops by 1.5x for crypto

  # Time horizons (crypto moves faster)
  time_compression: 0.25  # What takes 1 week in stocks = 1.75 days in crypto

  # Timeframe architecture - ADDED 2026-01-03
  # Defines which candle sizes to use for analysis
  timeframes:
    primary: "1H"              # 1-hour candles for main analysis
    confirmation: "4H"         # 4-hour candles for trend confirmation
    long_term_context: "1D"    # Daily candles for big-picture view
    min_candles_required: 200  # 200×1H = 8.3 days of data minimum
    regime_confirmation_periods: 2  # 2 consecutive 4H candles = 8 hours

  # Exchange-specific parameters - ADDED 2026-01-03
  # Kraken fee structure as of 2026
  exchange:
    name: "Kraken"
    fees:
      maker: 0.0016      # 0.16% maker fee
      taker: 0.0026      # 0.26% taker fee
      typical_round_trip: 0.0052  # Worst case: taker entry + taker exit = 0.52%
      best_case_round_trip: 0.0032  # Best case: maker entry + maker exit = 0.32%

    # Minimum trade sizes (Kraken limits)
    limits:
      min_order_usd: 10.0
      min_btc: 0.0001

    # Slippage expectations
    slippage:
      typical: 0.001     # 0.1% expected slippage on $100-500 orders
      max_acceptable: 0.005  # 0.5% max slippage tolerance

