[project]
name = "fathom"
version = "2.0.0"
description = "Fathom MCP - AI-native Kraken trading interface for the Rhiz project"
authors = [
    {name = "Rhiz Project", email = "rhiz@example.com"}
]
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    # MCP
    "mcp>=1.0.0",

    # HTTP clients
    "httpx>=0.27.0",

    # WebSocket
    "websockets>=12.0",

    # Vector memory (includes FastEmbed - NO sentence-transformers needed)
    "qdrant-client[fastembed]>=1.7.0",

    # Validation & config
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "black>=24.0.0",
    "ruff>=0.3.0",
]

[project.scripts]
fathom = "fathom.server:run"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
