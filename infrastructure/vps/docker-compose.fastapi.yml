version: '3.8'

services:
  fastapi-gateway:
    build:
      context: .
      dockerfile: Dockerfile.fastapi
    image: rhiz/fastapi-gateway:latest
    container_name: rhiz_fastapi_gateway
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Embedding service (should be on same network)
      - EMBEDDING_SERVICE_URL=http://embedding:5000
      # Qdrant connection
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_COLLECTION=moonchecks
    networks:
      - rhiz_network
    depends_on:
      - embedding
      - qdrant
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Embedding service (if not already deployed separately)
  # embedding:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile.embeddings
  #   container_name: rhiz_embedding
  #   restart: unless-stopped
  #   ports:
  #     - "5000:5000"
  #   networks:
  #     - rhiz_network

  # Qdrant (if not already deployed separately)
  # qdrant:
  #   image: qdrant/qdrant:latest
  #   container_name: rhiz_qdrant
  #   restart: unless-stopped
  #   volumes:
  #     - qdrant_data:/qdrant/storage
  #   ports:
  #     - "6333:6333"
  #     - "6334:6334"
  #   networks:
  #     - rhiz_network

networks:
  rhiz_network:
    name: rhiz_network
    external: true

