services:
  hummingbot-api:
    image: hummingbot/backend-api:latest
    container_name: rhiz_hummingbot_api
    restart: unless-stopped
    environment:
      - HUMMINGBOT_PASSWORD=${HUMMINGBOT_PASSWORD:-admin}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - hummingbot_data:/home/hummingbot
      - ./strategies:/home/hummingbot/strategies
      - ./credentials:/home/hummingbot/credentials
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - rhiz_network
      - n8n_default
    deploy:
      resources:
        limits:
          memory: 2G
    labels:
      - traefik.enable=true
      - traefik.http.routers.hummingbot-api.rule=Host(`api.srv1206808.hstgr.cloud`)
      - traefik.http.routers.hummingbot-api.tls=true
      - traefik.http.routers.hummingbot-api.entrypoints=web,websecure
      - traefik.http.routers.hummingbot-api.tls.certresolver=mytlschallenge
      - traefik.http.services.hummingbot-api.loadbalancer.server.port=8000

  dashboard:
    image: hummingbot/dashboard:latest
    container_name: rhiz_dashboard
    restart: unless-stopped
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
    networks:
      - rhiz_network
      - n8n_default
    depends_on:
      - hummingbot-api
    deploy:
      resources:
        limits:
          memory: 1G
    labels:
      - traefik.enable=true
      - traefik.http.routers.dashboard.rule=Host(`dash.srv1206808.hstgr.cloud`)
      - traefik.http.routers.dashboard.tls=true
      - traefik.http.routers.dashboard.entrypoints=web,websecure
      - traefik.http.routers.dashboard.tls.certresolver=mytlschallenge
      - traefik.http.services.dashboard.loadbalancer.server.port=8501

  postgres:
    image: postgres:15-alpine
    container_name: rhiz_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=hummingbot
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-hummingbot}
      - POSTGRES_DB=hummingbot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - rhiz_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hummingbot"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  emqx:
    image: emqx:5
    container_name: rhiz_emqx
    restart: unless-stopped
    ports:
      - "127.0.0.1:1883:1883"
      - "127.0.0.1:18083:18083"
    networks:
      - rhiz_network
    healthcheck:
      test: ["CMD", "emqx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  qdrant:
    image: qdrant/qdrant:latest
    container_name: rhiz_qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - rhiz_network
    deploy:
      resources:
        limits:
          memory: 2G

  redis:
    image: redis:7-alpine
    container_name: rhiz_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - rhiz_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 768M

networks:
  rhiz_network:
    driver: bridge
  n8n_default:
    external: true

volumes:
  hummingbot_data:
  postgres_data:
  qdrant_data:
  redis_data:
